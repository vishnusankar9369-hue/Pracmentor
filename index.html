<style>

<header><div class="hd"><h1><span style="display:block;font-size:24px;font-weight:600;color:var(--ac);letter-spacing:.3px">PracMentor</span>ExperiMentors · ME422S<small>Fluid Mechanics &amp; Hydraulic Machines Lab · Digital Twin</small></h1>
<nav id="nav"></nav><span id="who" class="mu"></span><button class="btn alt" id="so" style="display:none" onclick="signOut()">Sign out</button><select id="role" style="display:none" onchange="S.role=this.value;go(S.tab)"><option value="student">Student</option><option value="faculty">Faculty</option></select></div></header>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),n3=x=>+(+x).toPrecision(4);
/* ===== CONFIG AND ADAPTERS: the plug-in points for a real backend =====
   mode 'local' = demo, everything stays in this browser (NOT secure).
   mode 'http'  = set apiBase to your server; see the handoff spec for the endpoints. */
const CFG={mode:'local',apiBase:'',facultyCode:'faculty123'};
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const LocalAdapter={shared:false,
 signIn:async(role,id,name,secret)=>{if(role==='faculty'&&secret!==CFG.facultyCode)throw new Error('Wrong faculty access code.');let u={id,name,role};lsSet('fm_user',u);return u},
 signOut:()=>{lsSet('fm_user',null)},
 restore:()=>lsGet('fm_user'),
 load:async(u,db)=>{let sh=lsGet('fm')||{},pe=lsGet('fmu:'+u.id)||{};['docs','ovr','qs','sub'].forEach(k=>{if(sh[k]!==undefined)db[k]=sh[k]});['quiz','viva','sim'].forEach(k=>{if(Array.isArray(pe[k]))db[k]=pe[k]})},
 save:(u,db)=>{if(!u)return;if(u.role==='faculty')lsSet('fm',{docs:db.docs,ovr:db.ovr,qs:db.qs,sub:db.sub});lsSet('fmu:'+u.id,{quiz:db.quiz,viva:db.viva,sim:db.sim})},
 submitResults:async()=>({ok:false}),
 fetchSubmissions:async()=>[]
};
const http=async(m,p,b)=>{let r=await fetch(CFG.apiBase+p,{method:m,credentials:'include',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});if(!r.ok)throw new Error(r.status==401?'Not signed in, or wrong credentials.':'Server error '+r.status);return r.status==204?null:r.json()};
const HttpAdapter={shared:true,
 signIn:async(role,id,name,secret)=>(await http('POST','/auth/login',{role,id,name,secret})).user,
 signOut:()=>http('POST','/auth/logout').catch(()=>{}),
 restore:()=>http('GET','/auth/me').then(r=>r&&r.user).catch(()=>null),
 load:async(u,db)=>{let me=await http('GET','/data/me'),sh=await http('GET','/data/shared');['quiz','viva','sim'].forEach(k=>{if(me&&Array.isArray(me[k]))db[k]=me[k]});['docs','ovr','qs'].forEach(k=>{if(sh&&sh[k]!==undefined)db[k]=sh[k]})},
 save:(u,db)=>{if(!u)return;clearTimeout(HttpAdapter.t);HttpAdapter.t=setTimeout(()=>{http('PUT','/data/me',{quiz:db.quiz,viva:db.viva,sim:db.sim}).catch(()=>{});if(u.role==='faculty')http('PUT','/data/shared',{docs:db.docs,ovr:db.ovr,qs:db.qs}).catch(()=>{})},600)},
 submitResults:(u,pack)=>http('POST','/submissions',pack).then(()=>({ok:true})),
 fetchSubmissions:()=>http('GET','/submissions')
};
const cl=v=>JSON.parse(JSON.stringify(v===undefined?null:v));
const setSync=ok=>{if(USER)$('#who').textContent=USER.name+' · '+USER.role+(ok?'':' · not syncing')};
/* Shared mode: runs inside a published claude.ai page. Identity comes from claude.ai (no passwords);
   faculty = anyone who can edit the page, students = other signed-in people with Contributor access. */
const ArtifactAdapter={shared:true,managed:true,u:null,d:null,t:null,last:'',n:0,
 async init(){try{if(!window.claude||!window.claude.use)return false;const [u,d]=await Promise.all([claude.use('user'),claude.use('db')]);if(!u||!d)return false;this.u=u;this.d=d;return true}catch(e){return false}},
 async restore(){const me=await this.u.me();if(!me||!me.id)return null;return{id:me.id,name:me.name||'Signed-in user',role:(await this.u.canEdit())?'faculty':'student'}},
 signOut(){},
 async load(u,db){await LocalAdapter.load(u,db);try{
  const p=await this.d.doc('data/users/'+u.id+'/progress').get();if(p.exists){const x=p.data();['quiz','viva','sim'].forEach(k=>{if(Array.isArray(x[k]))db[k]=cl(x[k])});if(typeof x.roll==='string')db.roll=x.roll}
  const c=await this.d.doc('course/config').get();if(c.exists){const x=c.data();if(x.qs!==undefined)db.qs=cl(x.qs)}
  const ms=await this.d.collection('materials').get();this.n=ms.docs.length;if(ms.docs.length){db.docs=cl(ms.docs.map(q=>q.data()).sort((a,b)=>a.i-b.i).map(x=>({name:x.name,pages:x.pages})));this.last=JSON.stringify(db.docs)}
  if(u.role==='faculty'){const o=await this.d.doc('marks/overrides').get();if(o.exists&&o.data().map)db.ovr=cl(o.data().map)}
 }catch(e){console.warn(e);setSync(false)}},
 save(u,db){if(!u)return;LocalAdapter.save(u,db);clearTimeout(this.t);this.t=setTimeout(()=>this.flush(u,db),700)},
 async flush(u,db){try{
  await this.d.doc('data/users/'+u.id+'/progress').set(cl({quiz:db.quiz,viva:db.viva,sim:db.sim,roll:db.roll||''}));
  if(u.role==='faculty'){await this.d.doc('course/config').set(cl({qs:db.qs}));await this.d.doc('marks/overrides').set(cl({map:db.ovr||{}}));
   const j=JSON.stringify(db.docs);if(j!==this.last){const n=(db.docs||[]).length;for(let i=0;i<n;i++)await this.d.doc('materials/m'+i).set(cl({i,name:db.docs[i].name,pages:db.docs[i].pages}));for(let i=n;i<this.n;i++)await this.d.doc('materials/m'+i).delete();this.n=n;this.last=j}}
  setSync(true)}catch(e){console.warn(e);setSync(false)}},
 async submitResults(u,pack){const o=cl(pack);delete o.name;o.roll=DB.roll||'';await this.d.doc('submissions/'+u.id).set(o);return{ok:true}},
 async fetchSubmissions(){const sn=await this.d.collection('submissions').get(),ps=await this.u.profiles(sn.docs.map(q=>q.id)).catch(()=>({}));return sn.docs.map(q=>{const o=cl(q.data()),pr=ps&&ps[q.id];o.name=((pr&&pr.name)||'Student')+(o.roll?' ('+o.roll+')':'');return o})}
};
let BACKEND=CFG.mode==='http'?HttpAdapter:LocalAdapter;
let USER=null;
const who=()=>{if(!USER)return'';let r=DB.roll||(BACKEND.managed?'':USER.id);return USER.name+(r?' ('+r+')':'')};
let DB={quiz:[],viva:[],sim:[],ovr:{},qs:null,docs:null,sub:{}};
const save=()=>{BACKEND.save(USER,DB)};
const S={tab:'lab',role:'student',ex:0,p:{},rows:[],chat:[],mode:'tutor',viva:null,qz:null,rev:[]};

/* ---------- 10 experiments (ME522S Thermal Engineering Lab) ---------- */
const G=9.81,AR=d=>Math.PI*d*d/4,QQ=(H,a1,a2,c=1)=>c*a1*a2*Math.sqrt(2*G*H)/Math.sqrt(a1*a1-a2*a2),H2h=(Q,a1,a2,c)=>Math.pow(Q*Math.sqrt(a1*a1-a2*a2)/(c*a1*a2),2)/(2*G);
const meter=(n,fx,d1,d2,c0,ref)=>({n,fx,P:[['h','Manometer difference hm',2,20,10,1,'cm Hg']],ti:1,f(p){let a1=AR(d1),a2=AR(d2),H=p.h*.126,Qt=QQ(H,a1,a2),Qa=c0*Qt,t=.025/Qa;return{o:[['Manometer hm',p.h,'cm Hg'],['Time for 10 cm rise',t,'s']],r:[['Head H',H,'m water'],['Theoretical discharge',Qt,'m³/s'],['Actual discharge',Qa,'m³/s'],['Cd',Qa/Qt,'']],k:3,ref,cal:[H*100,Qa*1e6]}}});
const E=[
{n:'Metacentric height & radius of gyration',fx:'V = (h2 − h1)·AT (tank 0.8 m × 0.8 m);  Wvessel = ρgV;  GM = wX/(W tanθ), W = Wvessel + w;  K = (T/2π)√(g·GM), T = t10/10',
 P:[['w','Added weight',200,300,200,100,'g'],['X','Weight moved by',2,10,6,2,'cm']],
 f(p){let W0=94.2,w=p.w/1000*G,X=p.X/100,GM=.06,W=W0+w,th=Math.atan(w*X/(W*GM)),T=2*Math.PI*.18/Math.sqrt(G*GM);return{o:[['Water rise h2−h1',1.5,'cm'],['Weight w',p.w,'g'],['Distance X',p.X,'cm'],['Tilt θ',th*180/Math.PI,'°'],['Time, 10 oscillations',10*T,'s']],r:[['Metacentric height GM',w*X/(W*Math.tan(th)),'m'],['Vessel weight',W0,'N'],['Radius of gyration K',.18,'m']],k:0,ref:[.02,.15],th:th*180/Math.PI,T}}},
meter('Venturimeter calibration','Qth = A1A2√(2gH)/√(A1² − A2²), d1 = 25 mm, d2 = 15 mm;  H = hm(Sm/Sw − 1);  Qa = AX/t (tank 0.25 m², X = 0.1 m);  Cd = Qa/Qth;  Qa = kH^m',.025,.015,.97,[.9,1]),
meter('Orificemeter calibration','Qth = A1A2√(2gH)/√(A1² − A2²), d1 = 25 mm, d2 = 0.5·d1;  H = hm(Sm/Sw − 1);  Qa = AX/t (tank 0.25 m², X = 0.1 m);  Cd = Qa/Qth',.025,.0125,.62,[.55,.7]),
{n:'Friction losses in pipes (Darcy f, Chezy C)',fx:'hf = hm(Sm/Sw − 1);  v = Qa/a, Qa = AX/t;  f = 2g·d·hf/(L v²);  i = hf/L;  C = v/√(m·i), m = d/4;  Re = ρvd/μ  (L = 2 m, d = 17 mm, μ = 7.82×10⁻⁴)',
 P:[['V','Flow velocity (valve setting)',.5,3,1.5,.25,'m/s']],ti:1,
 f(p){let V=p.V,d=.017,L=2,Q=V*AR(d),Re=1000*V*d/7.82e-4,fr=.316/Math.pow(Re,.25),hf=fr*L*V*V/(2*G*d),i=hf/L;return{o:[['Manometer hm',hf/.126,'cm Hg'],['Time for 10 cm rise',.025/Q,'s']],r:[['Head loss hf',hf,'m water'],['Discharge Qa',Q,'m³/s'],['Velocity v',V,'m/s'],['Darcy friction factor f',fr,''],['Hydraulic gradient i',i,''],['Chezy constant C',V/Math.sqrt(d/4*i),'m½/s'],['Reynolds number',Re,'']],k:3,ref:[.015,.045]}}},
{n:'Rectangular notch calibration',fx:'Qth = (2/3)L√(2g)·H^(3/2), L = 10 cm;  H = h1 − h2 (sill h1 = 20 cm);  Qa = AX/t (0.25 m², X = 0.1 m);  Cd = Qa/Qth;  Qa = kH^m',
 P:[['H','Head over sill H',2,10,6,.5,'cm']],ti:1,
 f(p){let H=p.H/100,Qt=2/3*.1*Math.sqrt(2*G)*Math.pow(H,1.5),c=.64-.004*p.H,Qa=c*Qt;return{o:[['Hook gauge h2',20-p.H,'cm'],['Time for 10 cm rise',.025/Qa,'s']],r:[['Head H',H,'m'],['Theoretical discharge',Qt,'m³/s'],['Actual discharge',Qa,'m³/s'],['Cd',c,'']],k:3,ref:[.55,.7],cal:[p.H,Qa*1e6]}}},
{n:'Pelton wheel turbine',fx:'H = Pi×10;  Q = Cd a1a2√(2gh)/√(a1²−a2²), h = hm(13.6−1), d1 = 65 mm, d2 = 39 mm, Cd = 0.9;  T = (W1−W2)g·R, R = 0.15 m;  Output = 2πNT/60000;  η = Output/(ρgQH/1000)',
 P:[['N','Turbine speed',200,1400,800,100,'rpm']],
 f(p){let N=p.N,T=Math.max(0,76.3*(1-N/1500)),Q=.011*(1-.00004*(N-800)),H=40,hm=H2h(Q,AR(.065),AR(.039),.9)/.126,Wl=T/(.15*G),In=G*Q*H,Out=2*Math.PI*N*T/6e4;return{o:[['Inlet pressure Pi',4,'kg/cm²'],['Manometer h1−h2',hm,'cm Hg'],['Speed N',N,'rpm'],['Tight side W1',Wl+2,'kg'],['Slack side W2',2,'kg']],r:[['Total head H',H,'m'],['Discharge Q',Q,'m³/s'],['Turbine input',In,'kW'],['Load W',Wl,'kg'],['Torque T',T,'N·m'],['Turbine output',Out,'kW'],['Efficiency',Out/In*100,'%']],k:6,ref:[40,80]}}},
{n:'Francis turbine load test',fx:'H = (pi×10 + v²/2g) + po×13.6/1000;  v = Q/a1;  T = (m1−m2)g·r, r = 0.15 m;  OP = 2πNT/60 (W);  IP = ρgQH (W);  η = OP/IP.  Speed held at 1200 rpm',
 P:[['m','Load on brake drum',1,18,10,1,'kg']],
 f(p){let m=p.m,Q=.015+.0008*m,a1=AR(.1),v=Q/a1,H=12+v*v/(2*G)+150*.0136,OP=m*G*.15*2*Math.PI*1200/60,IP=1000*G*Q*H;return{o:[['Inlet pressure pi',1.2,'kg/cm²'],['Exit vacuum po',150,'mm Hg'],['Manometer h1−h2',H2h(Q,a1,AR(.06),.9)/.126,'cm Hg'],['Speed N',1200,'rpm'],['Tight side m1',m+2,'kg'],['Slack side m2',2,'kg']],r:[['Discharge Q',Q,'m³/s'],['Velocity v',v,'m/s'],['Total head H',H,'m'],['Input power IP',IP,'W'],['Output power OP',OP,'W'],['Efficiency',OP/IP*100,'%']],k:5,ref:[40,85]}}},
{n:'Centrifugal pump performance',fx:'H = Pd×10 + Ps×13.6/1000 + X (X = 0.22 m);  Q = Ah/t1 (A = 0.166 m², h = 0.15 m);  Motor input = (3600/e)(n/t2) kW (e = 3200, n = 10);  Output = ρgQH/1000;  η = Output/Input',
 P:[['Q','Delivery valve (discharge)',.2,1.4,1,.1,'L/s']],ti:2,
 f(p){let Q=p.Q/1000,H=18-4*p.Q*p.Q,Ps=40+60*p.Q,Pd=(H-.22-Ps*.0136)/10,Pin=.28+.1*p.Q,Po=G*Q*H;return{o:[['Pressure Pd',Pd,'kg/cm²'],['Vacuum Ps',Ps,'mm Hg'],['t1, 15 cm rise',.166*.15/Q,'s'],['t2, 10 pulses',11.25/Pin,'s']],r:[['Total head H',H,'m'],['Discharge Q',Q,'m³/s'],['Motor input',Pin,'kW'],['Pump output',Po,'kW'],['Overall efficiency',Po/Pin*100,'%']],k:4,ref:[15,45]}}},
{n:'Reciprocating pump performance',fx:'Qt = 2LAN/60 (L = 0.04 m, A = 0.0023758 m², N = 290 rpm);  Qa = Ah/t1 (A = 0.121 m²);  H = Pd×10 + Ps×13.6/1000 + 0.85;  Input = (3600/e)(n/t2);  η = ρgQaH/1000/Input;  Slip = (Qt − Qa)/Qt × 100',
 P:[['Pd','Delivery pressure',.5,4.5,2,.5,'kg/cm²']],ti:2,
 f(p){let Qt=2*.04*.0023758*290/60,s=.03+.012*p.Pd,Qa=Qt*(1-s),Ps=150+10*p.Pd,H=p.Pd*10+Ps*.0136+.85,Pin=.35+.115*p.Pd,Po=G*Qa*H;return{o:[['Pressure Pd',p.Pd,'kg/cm²'],['Vacuum Ps',Ps,'mm Hg'],['t1, 15 cm rise',.121*.15/Qa,'s'],['t2, 10 pulses',11.25/Pin,'s']],r:[['Total head H',H,'m'],['Actual discharge Qa',Qa,'m³/s'],['Theoretical discharge Qt',Qt,'m³/s'],['Motor input',Pin,'kW'],['Pump output',Po,'kW'],['Overall efficiency',Po/Pin*100,'%'],['Slip',s*100,'%']],k:5,ref:[20,60]}}},

const SAMPLE=`Metacentric height and radius of gyration of a floating body. Aim: determine the metacentric height GM, plot GM against tilt angle θ and find the radius of gyration K. The metacentric height GM is the distance between the centre of gravity of a floating body and its metacentre; a larger positive GM means the body is more stable, and a negative GM means it is unstable.
GM = wX/(W tanθ), where w is the added weight in N, X the distance the weight is moved in m, W the weight of the vessel plus the added weight in N, and θ the angle of heel. Weight of the vessel = ρ g V, with V = (h2 − h1) × tank area; the tank is 80 cm × 80 cm.
Radius of gyration K = (T/2π)√(g GM), where T is the period of one oscillation, taken as the time for 10 oscillations divided by 10. Procedure: set the plumb line to zero, place the weight 200 g or 300 g on one side at distance X, note the tilt θL, move it to the other side and note θR; repeat for other distances, then release the tilted vessel and time 10 oscillations five times.
---
Calibration of a venturimeter. Aim: determine the coefficient of discharge Cd, find the calibration equation and draw the calibration curve. A venturimeter has a converging part, a throat and a diverging part; the velocity is maximum at the throat.
Theoretical discharge Qth = A1 A2 √(2gH) / √(A1² − A2²). Head causing flow H = hm (Sm/Sw − 1) m of water, where hm = h1 − h2 is the difference of mercury levels and Sm/Sw = 13.6; so H is about 12.6 times hm. Actual discharge Qa = A X / t from the measuring tank. Cd = Qa/Qth, normally between 0.95 and 0.99, and less than 1 because of friction losses.
Calibration: Qa = k H^m, so log Qa = log k + m log H; the slope of the straight line gives the index m and the intercept gives log k. A venturimeter has a smaller head loss than an orifice meter because its diffuser gives good pressure recovery.
---
Calibration of an orificemeter. An orifice meter is a plate with a hole placed concentrically in the pipe between flanges; the orifice diameter is 0.5 times the pipe diameter. The pressure tappings are about 1.5 to 2 pipe diameters upstream and 0.5 pipe diameter downstream.
The equations are the same as for the venturimeter: Qth = A1 A2 √(2gH)/√(A1² − A2²), H = hm (Sm/Sw − 1), Qa = A X/t and Cd = Qa/Qth. The Cd of an orifice meter is about 0.6 to 0.65, lower than a venturimeter because of the vena contracta and the larger head loss.
Calibration uses the regression equations Σy = m Σx + n c and Σxy = m Σx² + c Σx with x = log H and y = log Qa. Procedure: keep valves closed, start the pump, release air from the manometer, adjust the control valve and note hm and the time t for X cm rise in the tank.
---
Friction losses in pipes: Darcy friction factor and Chezy constant. Test pipe: length 2 m, diameter 17 mm, tank 50 cm × 50 cm, mercury manometer. Darcy–Weisbach equation hf = f L V²/(2 g d), so f = 2 g d hf/(L V²).
Head loss hf = hm (Sm/Sw − 1) m of water. Velocity v = Qa/a with Qa = A X/t. Chezy's formula v = C √(m i), where i = hf/L is the hydraulic gradient and m = d/4 is the hydraulic mean depth. Reynolds number Re = ρ v d/μ with μ = 7.82 × 10⁻⁴ kg/m·s.
Plot f against Re and C against Re. Flow is laminar below Re 2000, where f = 64/Re. Compare the friction factor with the Moody chart. Procedure: note the maximum manometer difference, divide it by seven to fix six steps, and record hm and time t at each setting.
---
Calibration of a rectangular notch. A notch is an opening in the side of a tank or channel through which fluid flows with its free surface below the top edge. The sheet of liquid is the nappe; the bottom edge is the crest or sill. Head causing flow H = h1 − h2, measured with a hook gauge above the sill level.
Theoretical discharge Qth = (2/3) L √(2g) H^(3/2). Actual discharge Qa = A X/t. Cd = Qa/Qth, about 0.6 to 0.65 for a rectangular notch. Calibration equation Qa = k H^m, found by the graphical method or by regression using log Qa = log k + m log H.
If the head over the notch doubles, the discharge increases by 2^1.5, about 2.8 times. Procedure: start the pump with the discharge valve closed, note the sill reading h1, maintain a steady head, measure the time for X cm rise in the measuring tank, and repeat for different heads.
---
Performance test on a Pelton wheel turbine. Rated supply head 40 m, discharge 660 LPM, rated speed 800 rpm, runner diameter 300 mm, 20 cups, brake drum diameter 300 mm (R = 0.15 m), rated output 4 HP. The Pelton wheel is an impulse turbine used for high head and low discharge, and the spear regulates the jet.
Turbine input = ρ g Q H/1000 kW with H = Pi × 10 m of water (Pi in kg/cm²). Discharge Q = Cd a1 a2 √(2gh)/√(a1² − a2²) from a venturimeter with d1 = 65 mm, d2 = 39 mm and Cd = 0.9; h = (h1 − h2)(ρm/ρw − 1).
Turbine output = 2 π N T/60000 kW with torque T = (W1 − W2) g R from the rope brake. Efficiency = output/input × 100. Maximum load is calculated from the rated output 4 × 746 W at 800 rpm. Plot efficiency, output power and discharge against speed and read the economic speed from the graph.
---
Load test on a Francis turbine. Rated head 1.2 kg/cm², discharge 2000 LPM, rated speed 1200 rpm, runner diameter 180 mm, 8 guide vanes, brake drum 300 mm, rated output 4.5 hp. The Francis turbine is a reaction turbine; the pressure at the runner exit is below atmospheric and the draft tube regains kinetic energy.
Total head H = inlet head + exit head, where the inlet head = pi × 10 + v²/2g and the exit head = po × 13.6/1000 for a vacuum gauge reading po in mm of Hg. Input power IP = ρ g Q H in W; output power OP = 2 π N T/60 in W; efficiency = OP/IP.
Procedure: start with the belt loose and the guide vanes fully open, open the gate valve until the turbine runs at 1200 rpm, record readings, then load the brake drum and open the gate valve again to restore 1200 rpm for each load, with at least six readings. Regulate cooling water into the brake drum.
---
Performance of a centrifugal pump. Single-stage pump 0.37 kW, head 14 m, discharge 1 LPS, measuring tank area 0.166 m², energy meter constant 3200 imp/kWh. Total head H = Pd × 10 + Ps × 13.6/1000 + X, where Pd is the delivery pressure in kg/cm², Ps the suction vacuum in mm of Hg and X = 0.22 m is the gauge height difference.
Motor input = (3600/e)(n/t2) kW, where n = 10 pulses and t2 is the time for n pulses. Discharge Q = A h/t1 with h = 0.15 m. Pump output = ρ g Q H/1000 kW and overall efficiency = pump output/motor input × 100.
Plot discharge against motor input, head and efficiency. Procedure: open the suction valve, close the delivery gate valve, start the pump, then open the delivery valve in steps and record Pd, Ps, t1 and t2 for five or six discharges at constant speed. At the end leave the delivery valve open and switch off the pump before the power supply.
---
Performance of a reciprocating pump. Double-acting single-cylinder pump, 0.75 kW, 290 rpm, stroke L = 0.04 m, cylinder area A = 0.0023758 m², measuring tank area 0.121 m², energy meter 3200 imp/kWh, gauge height difference X = 0.85 m.
Theoretical discharge Qt = 2 L A N/60. Actual discharge Qa = A h/t1. Slip S = (Qt − Qa)/Qt × 100 %; slip arises from leakage past the piston and valves. Overall efficiency = pump output/motor input × 100, with output = ρ g Qa H/1000 and input = (3600/e)(n/t2).
Plot discharge, efficiency and input power against head. Procedure: open the suction and delivery valves, switch on the pump, set the delivery valve for different discharges at constant speed, and record Pd, Ps, t1 for 15 cm rise and t2 for 10 pulses. The delivery gate valve must not be fully closed when the experiment ends.
---
Impact of jet on vanes. Nozzle diameter 10 mm, supply pipe 25 mm, collecting tank 30 cm × 30 cm, counter weight 0.397 kg, vanes: flat plate (90°) and 60° vane. This experiment explains the principle of an impulse turbine such as the Pelton wheel, where the change of momentum of the jet is imparted to the vane as impulse force.
Discharge Q = A h/t. Velocity of jet V = Q/Anozzle. Theoretical force for a flat plate Ftheoretical = ρ A V²/g (kg); for a 60° vane Ftheoretical = ρ A V²(1 + cosθ)/g. Actual force Factual = W x/y, where W is the balance reading and x and y are the lever arm distances. Hydraulic power = ρ g Q H/1000 with H = Pd × 10.
Procedure: install the flat plate, balance the lever at no load with the counter weight, start the pump, admit water through the nozzle, record pressure, time for 10 cm rise, displacement and balance reading for at least six discharges, then repeat for the 60° vane. If the jet velocity increases the force increases roughly with the square of the velocity.
---
Course 102006/ME422S Fluid Mechanics and Hydraulic Machines Lab, 0-0-3, 2 credits. A minimum of 10 experiments must be performed. Assessment: 150 marks. Continuous Internal Evaluation 75 marks (attendance 15, continuous assessment 30, internal test 30) including viva voce on each practical session, and End Semester Examination 75 marks. Pass minimum 40 percent in the ESE and 50 percent overall. Minimum 75 percent attendance is mandatory to register for the ESE. The certified record must be submitted for the ESE.
Course outcomes: CO1 determine the coefficient of discharge of flow measuring devices and calibrate them; CO2 determine losses in pipes; CO3 determine metacentric height and stability of floating bodies; CO4 determine efficiency and characteristic curves of turbines; CO5 determine efficiency and characteristic curves of pumps; CO6 determine the force acting on vanes.`;

<button class="step" onclick="go('lab')"><i>1</i><b>Virtual Lab</b><span>Run ${E.length} experiments on a digital twin, from pumps to turbines.</span><em>Open Virtual Lab →</em></button>
<button class="step" onclick="go('chat')"><i>2</i><b>Lab Chatbot</b><span>Ask about theory and safety, or take a viva.</span><em>Open Chatbot →</em></button>
<button class="step" onclick="go('quiz')"><i>3</i><b>MCQ Quiz</b><span>Practise with MCQs that faculty review.</span><em>Start quiz →</em></button>
<button class="step" onclick="go('dash')"><i>4</i><b>Dashboard</b><span>Faculty track class progress and set final marks.</span><em>Open Dashboard →</em></button>
</div>
<div class="roles2">
<div class="card" ${S.role!='student'?'hidden':''}><h2>For students</h2><p class="mu">Practise, get answers on demand and see your progress.</p><div class="ex"><button onclick="asRole('student','lab')">Start experiment</button><button onclick="asRole('student','chat')">Ask a question</button><button onclick="asRole('student','quiz')">Take quiz</button><button onclick="asRole('student','dash')">Send my results</button></div></div>
<div class="card" ${S.role!='faculty'?'hidden':''}><h2>For faculty</h2><p class="mu">Set the viva rubric, review MCQs and upload lab materials.</p><div class="ex"><button onclick="asRole('faculty','dash')">Class dashboard</button><button onclick="asRole('faculty','mat')">Lab materials</button><button onclick="asRole('faculty','quiz')">Review MCQs</button></div></div>
</div>`}
const hashTab=()=>{let h=(location.hash||'').slice(1);return TABS.some(t=>t[0]==h)?h:'home'};
addEventListener('hashchange',()=>{if(USER)go(hashTab())});
function vCourse(){return`<div class="card"><h2>Course content · ME422S</h2><p class="mu">Fluid Mechanics and Hydraulic Machines Lab: ${E.length} experiments. Open any experiment in the Virtual Lab.</p></div>
${E.map((e,i)=>`<div class="card"><h2>${i+1}. ${esc(e.n)}</h2><p class="mu">Key relations: ${esc(e.fx||'')}</p><p><button class="btn" onclick="setEx(${i})">Open in Virtual Lab</button></p></div>`).join('')}
<div class="card"><h2>Reading materials</h2>${DB.docs.map(d=>`<p><b>${esc(d.name)}</b> · ${d.pages.length} pages</p>`).join('')||'<p class="mu">No documents yet.</p>'}<p><button class="btn alt" onclick="go('mat')">Open Lab Materials</button></p></div>`}
function asRole(r,t){if(USER&&USER.role===r)go(t)}
function vLogin(){let f=S.lg=='faculty';return`<div class="card" style="max-width:460px;margin:30px auto"><h2 style="font-size:22px">Prac<span style="color:var(--am)">Mentor</span> sign in</h2><div class="ex" style="margin:8px 0 12px"><button class="${!f?'on':''}" onclick="S.lg='student';go('login')">Student</button><button class="${f?'on':''}" onclick="S.lg='faculty';go('login')">Faculty</button></div>
<label class="mu" for="ln">Full name</label><input type="text" id="ln" autocomplete="name">
<label class="mu" for="li">${f?'Faculty ID or email':'Roll number'}</label><input type="text" id="li">
${f?'<label class="mu" for="lc">Access code</label><input type="password" id="lc" autocomplete="current-password">':''}
<p id="le" class="bad"></p><p><button class="btn" onclick="doLogin()">Sign in as ${f?'faculty':'student'}</button></p><p class="mu"><a href="${COVER}" target="_blank" rel="noopener">← Back to cover slide</a></p>
${CFG.mode=='local'?'<p class="mu">Demo mode: sign-in is checked in this browser only and is not secure. Real sign-in needs the server connection in the handoff spec.</p>':''}</div>`}
async function doLogin(){let f=S.lg=='faculty',n=$('#ln').value.trim(),i=$('#li').value.trim(),c=f?$('#lc').value:'';if(!n||!i){$('#le').textContent='Enter your name and '+(f?'faculty ID':'roll number')+'.';return}try{start(await BACKEND.signIn(S.lg,i.slice(0,40),n.slice(0,60),c))}catch(e){$('#le').textContent=e.message||'Sign-in failed.'}}
async function start(u){USER=u;DB.quiz=[];DB.viva=[];DB.sim=[];DB.roll='';await BACKEND.load(u,DB);ensureDocs();S.role=u.role;$('#role').value=u.role;S.chat=[];S.viva=null;S.qz=null;$('#who').textContent=u.name+' · '+u.role;$('#so').style.display='';$('#so').textContent=BACKEND.managed?'Exit to cover':'Sign out';go(hashTab())}
let COVER='cover.html';
function toCover(){location.href=COVER}
function signOut(){if(BACKEND.managed){toCover();return}BACKEND.signOut();USER=null;$('#who').textContent='';$('#so').style.display='none';go('login');toCover()}
async function submitRes(){try{let r=await BACKEND.submitResults(USER,JSON.parse(resPack()));alert(r&&r.ok?'Submitted to faculty.':'Could not submit.')}catch(e){alert('Could not submit: '+e.message)}}
async function pullSubs(){try{let a=await BACKEND.fetchSubmissions();(a||[]).forEach(o=>impText(JSON.stringify(o)));go('dash')}catch(e){alert('Could not refresh: '+e.message)}}
async function loadCfg(){try{let r=await fetch('config.json',{cache:'no-store'});if(r.ok)Object.assign(CFG,await r.json())}catch(e){}
try{let r=await fetch('data/materials.json',{cache:'no-store'});if(r.ok){let m=await r.json();if(Array.isArray(m)&&m.length)DB.docs=cl(m)}}catch(e){}
if(CFG.coverUrl)COVER=CFG.coverUrl;BACKEND=CFG.mode==='http'?HttpAdapter:LocalAdapter}
function boot(){S.lg='student';$('#v').innerHTML='<div class="card"><p class="mu">Loading…</p></div>';(async()=>{await loadCfg();try{if(await ArtifactAdapter.init())BACKEND=ArtifactAdapter}catch(e){}
let u=null;try{u=await BACKEND.restore()}catch(e){}
if(!u&&BACKEND.managed){BACKEND=LocalAdapter;try{u=await LocalAdapter.restore()}catch(e){}}
u?start(u):go('login')})()}
setEx(0);boot();
</script></body></html>
